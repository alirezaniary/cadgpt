[project]
name = "cadgpt-api"
version = "0.1.0"
description = "Multi-tenant HTTP API and async workers around the checking engine."
requires-python = ">=3.12"
dependencies = [
    "cadgpt-engine",
    "django>=5.1,<6.0",
    "djangorestframework>=3.15",
    "django-filter>=24.3",
    "drf-spectacular>=0.27",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.4",
    "django-environ>=0.11",
    "django-storages[s3]>=1.14",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "psycopg[binary]>=3.2",
    "structlog>=24.4",
    "gunicorn>=23.0",
    "whitenoise>=6.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cadgpt"]
