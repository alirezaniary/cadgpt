# The whole stack, as it actually runs: a database, a broker, the API, a worker that is
# a separate process rather than a thread, and the SPA behind a proxy.
#
# The worker is the point. A 47MB model takes ten seconds to check and a large one takes
# minutes, which is past what a browser or a proxy will hold open, so the check is queued
# and polled rather than awaited inside the request.

name: cadgpt

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cadgpt
      POSTGRES_PASSWORD: cadgpt
      POSTGRES_DB: cadgpt
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Deliberately not 5432 on the host: a developer machine very often already runs a
      # Postgres there, and a port clash on `make up` is a confusing first experience.
      # Inside the compose network the service still answers on 5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadgpt -d cadgpt"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # `image` is pinned to the same tag on both services on purpose. Without it Compose
    # builds one image per service from the same Dockerfile and tags them separately, so
    # rebuilding only `api` leaves the worker running older code -- which presents as a
    # fix that works over HTTP and not in the queue. They are one image by construction.
    image: cadgpt-api:latest
    build: &api_build
      context: ..
      dockerfile: deploy/docker/api.Dockerfile
    environment: &api_env
      DJANGO_SETTINGS_MODULE: cadgpt.config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-not-a-secret-change-me}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api,web
      DATABASE_URL: postgres://cadgpt:cadgpt@postgres:5432/cadgpt
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # Defaults match `base.py`'s own `env.int` defaults exactly -- overriding here does
      # nothing on an ordinary `make up`. T-0062's evidence needs this reachable from
      # compose, the same way T-0033's poison-message proof needs `WORKER_MEM_LIMIT`
      # reachable: `CHECK_RUN_STALL_SECONDS` and the broker's `visibility_timeout` both
      # derive from `CELERY_TASK_TIME_LIMIT`, so shrinking it here shrinks a real check's
      # allowed running time and both of those derived windows together, at the same 60s
      # margin, letting the exact real Celery/Redis/Docker mechanics this task's evidence
      # depends on play out in seconds instead of the production default's tens of minutes.
      CELERY_TASK_TIME_LIMIT: ${CELERY_TASK_TIME_LIMIT:-1800}
      CELERY_TASK_SOFT_TIME_LIMIT: ${CELERY_TASK_SOFT_TIME_LIMIT:-1500}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
      CSRF_TRUSTED_ORIGINS: http://localhost:5173,http://localhost:8080
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn cadgpt.config.wsgi:application --bind 0.0.0.0:8000
             --workers 3 --timeout 120 --access-logfile -"
    volumes:
      - media_data:/app/services/api/mediafiles
    ports:
      - "8000:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    image: cadgpt-api:latest
    build: *api_build
    environment: *api_env
    # --concurrency 2: a check is CPU-bound geometry work, not a waiting HTTP call, so
    # more workers than cores buys queueing rather than throughput.
    command: >
      celery -A cadgpt.config.celery worker
      --queues checks,default --concurrency 2 --loglevel info
    # T-0033: "peak worker memory" has no denominator without this. `MAX_UPLOAD_BYTES`
    # (services/api/cadgpt/config/settings/base.py) is derived from measured peak RSS
    # against exactly this limit, at this concurrency -- change one, re-derive the other.
    # Overridable so the same compose file can reproduce the poison-message evidence in
    # T-0033's task file with a deliberately smaller limit, e.g. `WORKER_MEM_LIMIT=400m`.
    mem_limit: ${WORKER_MEM_LIMIT:-4g}
    # T-0062: without this, Docker's default of 10s applies. `docker compose up -d worker`
    # sends SIGTERM; Celery's prefork pool answers a first SIGTERM with a *warm* shutdown
    # (verified against this image's installed celery==5.6.3: `celery.apps.worker.
    # install_worker_term_handler` maps plain SIGTERM to 'Warm', and
    # `celery.concurrency.prefork.TaskPool.on_stop` calls the billiard pool's `close()`
    # then `join()` -- new work stops, but an in-flight task's child process is left to
    # finish and exit on its own) -- so a check still running when the grace period
    # elapses is what forces Docker's SIGKILL, which kills every process in the container
    # at once, including Celery's own MainProcess. That is a different, harder failure
    # than T-0033's poison-message proof, where the OOM killer took only the *child* fork
    # and the surviving MainProcess raised `WorkerLostError` and re-queued the message
    # itself within seconds: here nothing survives to reject-and-requeue, so redelivery
    # waits on Redis's own `visibility_timeout` (`CELERY_BROKER_TRANSPORT_OPTIONS`,
    # `services/api/cadgpt/config/settings/base.py`) -- tens of minutes at the default,
    # racing `CHECK_RUN_STALL_SECONDS`'s own sweep for which one notices first. Either
    # way a healthy check's claim is spent on a deploy that had nothing to do with it.
    # `CELERY_TASK_TIME_LIMIT` (`base.py`) is this codebase's own standing answer to "how
    # long may a check legitimately run" -- `CHECK_RUN_STALL_SECONDS` already derives from
    # it by default, and a task that runs longer is stopped by Celery's own hard time
    # limit regardless of what Docker does. Setting the grace period to that same duration
    # plus the same 60s margin `CELERY_BROKER_TRANSPORT_OPTIONS` already adds to it (rather
    # than a new margin invented for this one setting) means an ordinary deploy's SIGTERM
    # is absorbed by the warm shutdown for every check that finishes within its own allowed
    # time, and only a task Celery itself would already have killed, or a real crash, ever
    # reaches Docker's SIGKILL. Overridable the same way `WORKER_MEM_LIMIT` is, so this
    # compose file can also reproduce T-0062's own evidence with a deliberately short
    # period, e.g. `WORKER_STOP_GRACE_PERIOD=10s` to restore the pre-fix behaviour on
    # demand.
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-1860s}
    volumes:
      - media_data:/app/services/api/mediafiles
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A cadgpt.config.celery inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  beat:
    # The process that actually calls `review.tasks.reap_stalled_runs` on a schedule
    # (`CELERY_BEAT_SCHEDULE`, services/api/cadgpt/config/settings/base.py). Without this
    # service the task is defined but never invoked -- T-0084.
    image: cadgpt-api:latest
    build: *api_build
    environment: *api_env
    command: celery -A cadgpt.config.celery beat --loglevel info
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    # The image's own HEALTHCHECK curls the gunicorn port `api` and `worker` run; `beat`
    # runs neither and would read as permanently unhealthy otherwise.
    healthcheck:
      disable: true

  web:
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  media_data:
