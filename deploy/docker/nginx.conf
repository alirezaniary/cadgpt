server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Client drawings are unpublished work; nothing here may be cached by a shared proxy.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A large model upload is slow and must not be buffered whole into memory.
        client_max_body_size 512m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location /healthz { proxy_pass http://api:8000/healthz; }
    location /readyz  { proxy_pass http://api:8000/readyz; }

    # A single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
