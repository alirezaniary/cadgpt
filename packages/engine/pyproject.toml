[project]
name = "cadgpt-engine"
version = "0.1.0"
description = "Deterministic IFC/IDS checking with three-valued results."
requires-python = ">=3.12"
dependencies = [
    "ifcopenshell==0.8.5",
    "ifctester==0.8.5",
]

[project.scripts]
cadgpt-check = "cadgpt_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadgpt_engine"]
