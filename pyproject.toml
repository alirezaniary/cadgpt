# One repository, several distributions with disjoint dependency sets (DEC-0004).
#
# Each distribution in docs/architecture/module-map.md is a dependency group here, so an
# environment can be resolved for one distribution alone. That is what makes I1 a fact
# rather than a policy: the engine environment does not contain an inference client, so
# the import is unresolvable and not merely forbidden.
#
# Adding a dependency is a decision record, never a task-level choice
# (docs/architecture/stack.md).

[project]
name = "cadgpt"
version = "0.0.0"
description = "Jurisdiction-agnostic building-code checking over IFC models."
requires-python = ">=3.12"
dependencies = []

[tool.uv]
# The repository root is not itself an installable package; the distributions below are
# resolved as dependency groups. No src/ layout exists yet — a directory is created by
# the task that first needs it (CLAUDE.md section 6).
package = false

[dependency-groups]
# Tooling the harness itself needs. Gates bring their own tooling as they are registered.
# pytest-randomly is gate 16's (DEC-0027 §3): it is the only caller that re-enables it,
# with -p randomly and two different seeds; every other run carries -p no:randomly below.
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "pytest-randomly>=3.15"]

# cadgpt-engine — src/engine. No inference SDK and no HTTP client, ever (I1, I2).
# This absence is asserted by the isolation-proof gate (harness.md gate 4).
engine = [
    "ifcopenshell",
    "ifcpatch",
    "ifctester",
    "topologicpy",
    "shapely",
    "pydantic>=2",
]

# cadgpt-presentation — src/presentation.
presentation = [
    { include-group = "engine" },
    "weasyprint",
    "arabic-reshaper",
    "python-bidi",
]

# cadgpt-codification — src/codification. The only distribution permitted an inference
# client; both inference planes sit behind one OpenAI-compatible port (DEC-0009).
codification = [
    { include-group = "engine" },
    "openai",
]

# cadgpt-assistance — src/assistance. Strictly downstream; consumes, never produces.
assistance = [
    { include-group = "engine" },
    { include-group = "presentation" },
    "openai",
    "mcp",
]

# cadgpt-connector — src/connector. The one distribution that ships to user machines.
connector = ["mcp"]

# cadgpt-api — src/api. Imports everything, is imported by nothing.
api = [
    { include-group = "assistance" },
    { include-group = "codification" },
    { include-group = "connector" },
]

[tool.ruff]
# Gate 1 (docs/architecture/harness.md). Configured here and nowhere else: one place,
# per T-0002.
#
# `include` is stated rather than defaulted because ruff also formats Python inside
# Markdown fences, and the task specs under docs/ are prose whose fences are illustrative
# — reformatting them would make the gate rewrite documentation.
include = ["*.py", "*.pyi", "pyproject.toml"]
# Deliberately bad inputs used to prove gates 1, 2 and 14 can fail (DEC-0016). They are
# copied into a scanned path by tools/tests/test_gates_static.py and are excluded at rest,
# so the repository can pass its own verify while still holding a proof of failure.
extend-exclude = ["tools/tests/badfixtures"]
# The prose and code in this repository wrap at 92; 88 would reformat the existing corpus.
line-length = 92

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # import order
    "UP",     # pyupgrade
    "B",      # bugbear
    "BLE",    # blind except — CLAUDE.md forbids swallowing an error
    "RUF",    # ruff's own rules, including RUF100 below
    "RUF100", # unused `noqa`; listed explicitly because CLAUDE.md forbids suppressing a
              # warning, so every surviving `noqa` must be load-bearing. RUF100 only works
              # alongside the real selection: on its own it reports every other rule as
              # non-enabled and calls live suppressions dead.
]

[tool.mypy]
# Gate 2 (docs/architecture/harness.md). Configured here and nowhere else: one place, per
# T-0002. The gate passes --strict on the command line; no blanket ignore is configured,
# and a needed ignore is narrow, inline and carries a reason.
#
# The deliberately bad inputs proving the gates can fail (DEC-0016) are excluded at rest,
# for the reason given beside the same exclusion under [tool.ruff].
exclude = ["^tools/tests/badfixtures/"]

[tool.pytest.ini_options]
# Tests live beside the module they prove, so the repository root must be importable.
pythonpath = ["."]
# Gate 15 (docs/architecture/harness.md): classification of unit vs integration is
# explicit, never inferred from a file's path or name. spawns_harness is gate 16's
# deselection marker (DEC-0027 §1) — exactly the eight tests
# tools/tests/conftest.SPAWNS_A_RE_ENTERING_PROCESS names, pinned there rather than here.
markers = [
    "integration: a test that enters at a real outer boundary and exits at a real output",
    "spawns_harness: spawns a process that re-enters this suite; gate 16 deselects it",
]
# pytest-randomly is installed for gate 16 (DEC-0027 §3) but must not change any other
# run's collection order — gate 14, a developer's plain `pytest`, every copied-tree proof
# in tools/tests/ all stay exactly as order-stable as before it was added. Gate 16 is the
# only caller that passes -p randomly back, with two different seeds.
addopts = ["-p", "no:randomly"]
