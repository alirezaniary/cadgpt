# Virtual workspace root. It ships no code of its own: it pins the toolchain, holds the
# one lockfile, and carries the guards that apply across every member.

[tool.uv.workspace]
members = ["packages/*", "services/api"]

[tool.uv.sources]
cadgpt-engine = { workspace = true }
cadgpt-api = { workspace = true }

[dependency-groups]
dev = [
    "cadgpt-engine",
    "cadgpt-api",
    "pytest>=8.0",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.14",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs[compatible-mypy]>=3.15",
    "types-python-dateutil>=2.9",
    "factory-boy>=3.3",
]

[tool.ruff]
line-length = 92
extend-exclude = ["**/migrations/*"]

# `ruff format` also reformats fenced ```python blocks inside Markdown. A task file under
# docs/tasks/ quotes buggy code as evidence -- e.g. `description=str(facet),` -- and that
# quote must stay byte-identical to what it describes, not get silently rewritten into a
# different, syntactically-valid statement (a fragment with a trailing comma parses as a
# one-element tuple assignment, which is not what the quoted line says). Scoped to `format`
# only: `ruff check` finds no lint issues in docs/ today and this is a formatting-only
# footgun.
[tool.ruff.format]
exclude = ["docs/**"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import order
    "UP",   # pyupgrade
    "B",    # bugbear
    "BLE",  # blind except - CLAUDE.md forbids swallowing an error
    "DJ",   # flake8-django
    "RUF",
    "TID",  # flake8-tidy-imports - no relative imports across modules
    "N",    # pep8-naming
    "S",    # bandit
    "T20",  # no stray print() outside the CLI
    "SIM",
    "PTH",  # pathlib over os.path
    "ARG",  # unused arguments
]
ignore = [
    "S101",  # assert is how tests are written
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "ARG001", "ARG002"]
"**/conftest.py" = ["S105", "S106", "ARG001", "ARG002"]
"packages/engine/src/cadgpt_engine/cli.py" = ["T20"]
"packages/engine/tests/fixtures/make_fixtures.py" = ["T20"]
"services/api/cadgpt/config/settings/*" = ["F403", "F405"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "cadgpt.config.settings.test"

# ifctester ships no py.typed marker. Scoped to that package alone: our own code stays
# strict, and everything crossing this boundary is typed by hand in the engine.
[[tool.mypy.overrides]]
module = [
    "ifctester.*",
    "ifcopenshell.*",
    "celery.*",
    "environ.*",
    "factory.*",
    "django_filters.*",
]
ignore_missing_imports = true

# django-filter and celery ship no type information, so their base classes are `Any`.
# Subclassing them is the documented way to use both; the alternative is hand-written
# stubs for two libraries we do not maintain.
[[tool.mypy.overrides]]
module = ["cadgpt.apps.*.api.v1.filters", "cadgpt.apps.base.tasks"]
disallow_subclassing_any = false

# `@shared_task` is untyped upstream, so every task function it decorates reads as
# untyped however carefully the body is annotated. The bodies stay strictly checked;
# only the decorator's own typelessness is tolerated, and only in task modules.
[[tool.mypy.overrides]]
module = ["cadgpt.apps.review.tasks"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "cadgpt.config.settings.test"
pythonpath = ["services/api"]
testpaths = ["packages/engine/tests", "services/api/cadgpt"]
addopts = "-q --strict-markers"
markers = [
    "integration: enters at a real entry point over real files and exits at a real output",
]
filterwarnings = ["error::DeprecationWarning:cadgpt.*"]

# ---------------------------------------------------------------------------
# Import contracts. These are the boundaries that make this a modular monorepo
# rather than a monolith with folders, and they fail the build rather than a review.
# ---------------------------------------------------------------------------

[tool.importlinter]
root_packages = ["cadgpt_engine", "cadgpt"]
include_external_packages = true

# I1 - rule evaluation is deterministic code. The engine cannot reach an inference client,
# a web framework, or the network. This is the guard the whole product rests on.
[[tool.importlinter.contracts]]
name = "I1 - no inference client, web framework or network reaches the checking engine"
type = "forbidden"
source_modules = ["cadgpt_engine"]
forbidden_modules = [
    "anthropic",
    "openai",
    "httpx",
    "aiohttp",
    "requests",
    "socket",
    "urllib",
    "django",
    "rest_framework",
    "celery",
]

# The engine is a library the service depends on, never the other way round.
[[tool.importlinter.contracts]]
name = "The engine knows nothing about the service that hosts it"
type = "forbidden"
source_modules = ["cadgpt_engine"]
forbidden_modules = ["cadgpt"]

# Feature apps stack. A lower layer may not import a higher one, so a change to review/
# can never ripple down into base/ and tenancy/.
[[tool.importlinter.contracts]]
name = "Django apps are layered"
type = "layers"
layers = [
    "cadgpt.apps.review",
    "cadgpt.apps.rulepack",
    "cadgpt.apps.media",
    "cadgpt.apps.tenancy",
    "cadgpt.apps.account",
    "cadgpt.apps.base",
]
exhaustive = false

# The service layer is the product. It may not reach up into the transport that called it,
# which is what keeps business logic callable from a Celery task, a management command or
# a future MCP tool without dragging DRF along.
[[tool.importlinter.contracts]]
name = "Services never import the transport layer"
type = "forbidden"
source_modules = [
    "cadgpt.apps.account.services",
    "cadgpt.apps.tenancy.services",
    "cadgpt.apps.media.services",
    "cadgpt.apps.rulepack.services",
    "cadgpt.apps.review.services",
]
forbidden_modules = [
    "cadgpt.apps.account.api",
    "cadgpt.apps.tenancy.api",
    "cadgpt.apps.media.api",
    "cadgpt.apps.rulepack.api",
    "cadgpt.apps.review.api",
    "cadgpt.config.urls",
]

# Models hold no business logic and therefore need no service. Enforcing the direction
# stops the circular "model calls service calls model" tangle before it starts.
[[tool.importlinter.contracts]]
name = "Models never import services"
type = "forbidden"
source_modules = [
    "cadgpt.apps.account.models",
    "cadgpt.apps.tenancy.models",
    "cadgpt.apps.media.models",
    "cadgpt.apps.rulepack.models",
    "cadgpt.apps.review.models",
]
forbidden_modules = [
    "cadgpt.apps.account.services",
    "cadgpt.apps.tenancy.services",
    "cadgpt.apps.media.services",
    "cadgpt.apps.rulepack.services",
    "cadgpt.apps.review.services",
]
