[project]
name = "cadgpt"
version = "0.0.0"
description = "Check IFC models against IDS rule sets and report what passes, fails, and cannot be determined."
requires-python = ">=3.12"
dependencies = [
    "ifcopenshell==0.8.5",
    "ifctester==0.8.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "import-linter>=2.14"]

[tool.ruff]
line-length = 92

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import order
    "UP",  # pyupgrade
    "B",   # bugbear
    "BLE", # blind except - CLAUDE.md forbids swallowing an error
    "RUF",
]

[tool.mypy]
python_version = "3.12"

# ifctester ships no py.typed marker. Scoped to that package alone: our own code stays
# strict, and anything crossing this boundary is typed by hand in engine/check.py.
[[tool.mypy.overrides]]
module = ["ifctester.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["engine"]
include_external_packages = true

# I1: rule evaluation is deterministic code. The engine cannot reach an inference client,
# and cannot reach a web framework. This is the one guard that has teeth.
[[tool.importlinter.contracts]]
name = "I1 - no inference client or web framework reaches the checking engine"
type = "forbidden"
source_modules = ["engine"]
forbidden_modules = [
    "anthropic",
    "openai",
    "httpx",
    "aiohttp",
    "socket",
    "django",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: enters at a real entry point over real files and exits at a real output",
]
